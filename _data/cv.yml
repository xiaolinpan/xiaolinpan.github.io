- title: Research Highlights
  type: list
  contents:
    - "<b>Publications:</b> 18 peer-reviewed papers, including 6 first-author papers in <i>Chem. Sci.</i> (ChemSci Pick of the Week), <i>J. Chem. Theory Comput.</i>, <i>Chem. Res. Toxicol.</i> and <i>J. Chem. Inf. Model.</i> (×3)."
    - "<b>Independent funding:</b> FWF ESPRIT Fellowship as Principal Investigator (EUR 349,732) and Humboldt Research Fellowship for Postdoctoral Researchers (2026)."
    - "<b>Prospective validation:</b> CACHE #6 hit discovery; Polaris ADMET 2025 top-5 of 300+; Tox24 5th of 78; experimentally confirmed NMDA-receptor hit."
    - "<b>Research software:</b> lead developer of MolGpKa, MolTaut, sPhysNet-Taut and AA-Score; the Xundrug platform has received more than 1,100,000 visits."
    - "<b>Mentoring and service:</b> mentored 5 trainees (3 resulting papers); reviewer for 8 journals including <i>Chem. Soc. Rev.</i> and <i>Chem. Sci.</i>"

